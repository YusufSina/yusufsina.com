name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Never run two deploys at the same time; a newer push waits for the running one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out/
          retention-days: 7

  # Uploads only on pushes to main (and manual runs); pull requests just build.
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://yusufsina.com
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out/

      - name: Upload to server over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./out/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
