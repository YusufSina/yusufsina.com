<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Cash flow diagram: assets generate income, liabilities create expenses" font-family="Poppins, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="720" height="400" rx="16" fill="#f8fafc"/>
  <text x="360" y="44" fill="#111827" font-size="20" font-weight="700" text-anchor="middle">Cash flow, the idea that stuck with me</text>
  <text x="140" y="88" fill="#64748b" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1">INCOME STATEMENT</text>
  <text x="580" y="88" fill="#64748b" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1">BALANCE SHEET</text>
  <rect x="40" y="104" width="200" height="90" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="140" y="146" fill="#065f46" font-size="20" font-weight="700" text-anchor="middle">Income</text>
  <text x="140" y="170" fill="#047857" font-size="13" text-anchor="middle">money coming in</text>
  <rect x="40" y="250" width="200" height="90" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="140" y="292" fill="#991b1b" font-size="20" font-weight="700" text-anchor="middle">Expenses</text>
  <text x="140" y="316" fill="#b91c1c" font-size="13" text-anchor="middle">money going out</text>
  <rect x="480" y="104" width="200" height="90" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="580" y="146" fill="#065f46" font-size="20" font-weight="700" text-anchor="middle">Assets</text>
  <text x="580" y="170" fill="#047857" font-size="13" text-anchor="middle">businesses, stocks, rentals</text>
  <rect x="480" y="250" width="200" height="90" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="580" y="292" fill="#991b1b" font-size="20" font-weight="700" text-anchor="middle">Liabilities</text>
  <text x="580" y="316" fill="#b91c1c" font-size="13" text-anchor="middle">loans, car, consumer debt</text>
  <line x1="476" y1="149" x2="248" y2="149" stroke="#059669" stroke-width="3" marker-end="url(#g)"/>
  <text x="360" y="138" fill="#047857" font-size="13" font-weight="600" text-anchor="middle">puts money in your pocket</text>
  <line x1="476" y1="295" x2="248" y2="295" stroke="#dc2626" stroke-width="3" marker-end="url(#r)"/>
  <text x="360" y="284" fill="#b91c1c" font-size="13" font-weight="600" text-anchor="middle">takes money out of your pocket</text>
  <text x="360" y="378" fill="#334155" font-size="14" text-anchor="middle">Build the top row, keep the bottom row small.</text>
</svg>
